name: Kalender-Feed bauen

on:
  schedule:
    - cron: '17 */6 * * *'     # alle 6 Stunden
  workflow_dispatch:            # manuell auslösbar
  push:
    paths:
      - 'scripts/build-ics.mjs'
      - '.github/workflows/calendar.yml'

permissions:
  contents: write

concurrency:
  group: calendar-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ICS erzeugen
        run: node scripts/build-ics.mjs

      - name: Committen wenn geändert
        run: |
          if git diff --quiet -- calendar.ics; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "Kalender-Feed aktualisiert"
          git push
